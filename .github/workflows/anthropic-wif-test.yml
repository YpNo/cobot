name: anthropic-wif-test

# Spike: can the evals and the knowledge refresh drop the stored ANTHROPIC_API_KEY for workload
# identity federation (GitHub OIDC -> Anthropic token)? Run by hand on main, in the `evals`
# environment, so the federation rule can require `repo:YpNo/cobot:environment:evals`.
# It answers four questions in the job summary: does the exchange work, what the GitHub token
# carries (claim names, lifetime, whether it has a single-use `jti`), does Claude Code
# authenticate from the federation variables alone, and do two sessions sharing one GitHub token
# collide. Costs two one-word replies. Remove once ci.yml and knowledge-refresh.yml are switched.

on:
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Claude Code version to test (npm)"
        type: string
        default: "2.1.322"

permissions: {}

jobs:
  wif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: evals
    permissions:
      id-token: write # GitHub issues an OIDC token only to jobs that ask for it
    env:
      # identifiers, not credentials: Anthropic's docs call them safe to commit; the rule's
      # conditions on the GitHub token are the security boundary
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01A7ML6vt28VD8gT3ZCZXBPH
      ANTHROPIC_ORGANIZATION_ID: f39e220c-c98a-42cf-83f0-7edb6bd47e5e
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01XY4Bfkp2fHZUNph2wiLRCZ
      ANTHROPIC_WORKSPACE_ID: wrkspc_01PjZAh3k9K91G95sGq23v5Z
      AUDIENCE: https://api.anthropic.com
    steps:
      - name: GitHub token shape (claim names, subject, lifetime; never the token)
        run: |
          set -euo pipefail
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{sub, aud, ref, environment, event_name,
            claims: (keys), has_jti: has("jti"), lifetime_s: (.exp - .iat)}' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Token exchange (prints token_type, expires_in, scope; never the token)
        run: |
          set -euo pipefail
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          body=$(jq -n --arg a "$jwt" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: $a,
            federation_rule_id: env.ANTHROPIC_FEDERATION_RULE_ID,
            organization_id: env.ANTHROPIC_ORGANIZATION_ID,
            service_account_id: env.ANTHROPIC_SERVICE_ACCOUNT_ID,
            workspace_id: env.ANTHROPIC_WORKSPACE_ID}')
          code=$(curl -sS -o exchange.json -w '%{http_code}' https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" --data "$body")
          echo "exchange HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq '{token_type, expires_in, scope, error}' exchange.json | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f exchange.json
          test "$code" = 200

      - name: Install Claude Code
        env:
          VERSION: ${{ inputs.claude_version }}
        run: npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@$VERSION"

      - name: Claude Code from the federation variables alone (no key, no auth token)
        run: |
          set -uo pipefail
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/gha-jwt"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          echo "::add-mask::$(cat "$ANTHROPIC_IDENTITY_TOKEN_FILE")"
          claude --version | tee -a "$GITHUB_STEP_SUMMARY"
          claude -p "Reply with exactly the word OK." --max-turns 1 --output-format json > one.json 2> one.err
          rc=$?
          echo "single session: exit $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          jq '{is_error, result, total_cost_usd}' one.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || head -c 600 one.err
          exit "$rc"

      - name: Two sessions sharing one GitHub token (single-use jti collision?)
        if: always()
        run: |
          set -uo pipefail
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/gha-jwt"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          echo "::add-mask::$(cat "$ANTHROPIC_IDENTITY_TOKEN_FILE")"
          claude -p "Reply with exactly the word A." --max-turns 1 --output-format json > a.json 2> a.err & pa=$!
          claude -p "Reply with exactly the word B." --max-turns 1 --output-format json > b.json 2> b.err & pb=$!
          wait "$pa"; ra=$?; wait "$pb"; rb=$?
          echo "parallel sessions: exit $ra and $rb (one non-zero suggests jti_reused)" | tee -a "$GITHUB_STEP_SUMMARY"
          for s in a b; do jq -c '{is_error, result}' "$s.json" 2>/dev/null || head -c 300 "$s.err"; done \
            | tee -a "$GITHUB_STEP_SUMMARY"
