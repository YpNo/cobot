name: CI

on:
  push:
    branches: [main]
  pull_request: # every base: a PR stacked on another branch runs too
  workflow_dispatch:
    inputs:
      evals:
        description: "Run the plugin evals (paid Claude sessions)"
        type: boolean
        default: false
      cases:
        description: "Only the eval cases matching this one glob, * wildcards (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # merge runs on main complete

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          python -m pip install --quiet ruff==0.17.4 pytest==9.2.0 pytest-cov==7.1.0
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.318
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          shellcheck install.sh plugins/cobot/hooks/*.sh scripts/*.sh scripts/spikes/*.sh
          python3 scripts/check-plugin.py plugins/cobot
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate plugins/cobot --strict
          claude plugin validate . --strict
      - name: Test with coverage
        run: pytest --cov=plugins/cobot/bin --cov-report=term-missing --cov-fail-under=85
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the online audits read other repositories' action metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # code scanning is a paid feature on a private repository; findings arrive as
          # annotations instead, and the action fails the job on a medium or worse
          advanced-security: false
          annotations: true
          min-severity: medium

  # the one required check (decision 17): fails when a needed job failed or was cancelled,
  # passes when one was legitimately skipped (the evals run on dispatch only)
  ci-ok:
    needs: [quality, zizmor, evals]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then exit 1; fi

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.evals
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the full suite took 40 minutes; a timeout loses every result
    # no stored key: workload identity federation through the federation identifiers set on this
    # environment (scripts/github-settings.sh creates it, deployable from main only)
    environment: evals
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token Anthropic exchanges for a short-lived access token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code and the sandbox backend
        # Ubuntu restricts unprivileged user namespaces through AppArmor twice: the sysctl, and the
        # bwrap-userns-restrict profile that strips every capability from bwrap's children. Either
        # one makes the sandbox's nested namespace fail on /proc/self/setgroups, and every Bash call
        # with it (runs 43389854358 and 43492553354). The runner is discarded after the job.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if sudo grep -q '^bwrap ' /sys/kernel/security/apparmor/profiles; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.322
      # what the sandbox does around each Bash call, so a blocked runner fails here and costs nothing
      - name: Check the sandbox can nest a user namespace
        run: bwrap --unshare-user --dev-bind / / unshare --user --map-root-user true
      - name: Run evals
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          CASES: ${{ inputs.cases }}
        run: |
          . scripts/anthropic-federation.sh
          cd plugins/cobot
          # --keep-temp keeps each run's trace, the only record of what the session did
          set -- --trust-plugin --scaffold --no-publish --keep-temp --runs 3 --threshold 1.0 \
            --model claude-sonnet-5-5 --judge-model claude-haiku-5-5 --max-cost-usd 10 \
            --allow-tools Bash Write Edit --json ../../eval-result.json
          if [ -n "$CASES" ]; then set -- "$@" --case "$CASES"; fi
          claude plugin eval . "$@"
      # a failed threshold is the run worth reading: upload unless the run was cancelled
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: eval-result
          path: |
            eval-result.json
            plugins/cobot/evals/results/
          if-no-files-found: warn
          retention-days: 14
      # eval-result.json maps each run to its trace (tracePath)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: eval-traces
          path: /tmp/claude-eval-*/out/trace.jsonl
          if-no-files-found: warn
          retention-days: 14
