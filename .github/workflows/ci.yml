name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      evals:
        description: "Run the plugin evals (paid Claude sessions)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # merge runs on main complete

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          python -m pip install --quiet ruff==0.17.4 pytest==9.2.0 pytest-cov==7.1.0
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.318
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          shellcheck install.sh plugins/partner/hooks/*.sh scripts/*.sh
          python3 scripts/check-plugin.py plugins/partner
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate plugins/partner --strict
          claude plugin validate . --strict
      - name: Test with coverage
        run: pytest --cov=plugins/partner/bin --cov-report=term-missing --cov-fail-under=85
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  # the one required check (decision 17): fails when a needed job failed or was cancelled,
  # passes when one was legitimately skipped (the evals run on dispatch only)
  ci-ok:
    needs: [quality, zizmor, evals]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then exit 1; fi

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code and the sandbox backend
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.318
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd plugins/partner
          claude plugin eval . --trust-plugin --scaffold --no-publish --runs 3 --threshold 1.0 \
            --model claude-sonnet-5-5 --judge-model claude-haiku-5-5 --max-cost-usd 10 \
            --allow-tools Bash Write Edit --json ../../eval-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-result
          path: eval-result.json
