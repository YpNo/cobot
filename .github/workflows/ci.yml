name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          python -m pip install --quiet ruff==0.17.4 pytest==9.2.0 pytest-cov==7.1.0
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.318
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          shellcheck install.sh plugins/partner/hooks/gate.sh
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate plugins/partner --strict
          claude plugin validate . --strict
      - name: Test with coverage
        run: pytest --cov=plugins/partner/bin --cov-report=term-missing --cov-fail-under=85
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
