name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          grep -q "\"version\": \"$v\"" plugins/cobot/.claude-plugin/plugin.json
          grep -q "\"version\": \"$v\"" plugins/cobot/.antigravity-plugin/plugin.json
          grep -q "\"version\": \"$v\"" .claude-plugin/marketplace.json
          grep -q "^## \[$v\]" CHANGELOG.md
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
